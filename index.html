<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конвертер валют</title>
<style>
:root{
  --bg:#0f172a; --card:#142036; --bg2:#1a1f2b;
  --accent:#4fd1ac; --txt:#e6f0ff; --mute:#8aa0bb;
  --err:#fb7185; --ok:#34d999;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;
  background:radial-gradient(1200px 600px at 20% 0%,#1a2844 0%,#0f172a 60%);
  color:var(--txt);
}
.app{
  width:100%;max-width:480px;background:var(--card);
  border:1px solid rgba(255,255,255,.08);border-radius:22px;
  padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.45);
}
.head{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.head-icon{
  width:38px;height:38px;border-radius:12px;
  background:linear-gradient(135deg,#4fd1ac,#20b980);
  display:grid;place-items:center;font-size:20px;color:#06121f;font-weight:800;
}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--mute);font-size:12px;margin-top:3px}
label{
  display:block;font-size:12px;color:var(--mute);
  margin:0 0 8px 2px;text-transform:uppercase;letter-spacing:.08em;
}
input,select{
  width:100%;padding:14px 16px;border-radius:12px;
  border:1px solid rgba(255,255,255,.1);background:var(--bg2);
  color:var(--txt);font-size:17px;font-weight:600;outline:none;
  transition:border-color .15s,box-shadow .15s;font-family:inherit;
}
input:focus,select:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(79,209,172,.15);
}
.row{display:grid;grid-template-columns:1fr 40px 1fr;gap:10px;align-items:end}
.swap{
  height:42px;width:42px;border-radius:12px;
  border:1px solid rgba(255,255,255,.1);background:var(--bg2);
  color:var(--accent);font-size:17px;cursor:pointer;
  transition:transform .2s,border-color .15s;
  display:grid;place-items:center;padding:0;
}
.swap:hover{transform:rotate(180deg);border-color:var(--accent)}
.swap:active{transform:rotate(180deg) scale(.9)}
.out{
  margin-top:20px;padding:20px;border-radius:16px;
  background:linear-gradient(180deg,rgba(79,209,172,.08),rgba(79,209,172,.02));
  border:1px solid rgba(79,209,172,.15);
  min-height:78px;display:flex;align-items:center;
  justify-content:space-between;gap:12px;
}
.res{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.1;word-break:break-all}
.res-small{font-size:13px;color:var(--mute);margin-top:4px}
.rate{font-size:12px;color:var(--mute);text-align:right;white-space:nowrap}
.err{color:var(--err)}
.btn-row{display:flex;gap:10px;margin-top:16px}
button{
  cursor:pointer;border:none;border-radius:12px;
  padding:12px 16px;font-size:13px;font-weight:700;
  font-family:inherit;transition:filter .15s,border-color .15s;
}
.btn-primary{background:var(--accent);color:#06121f;flex:1}
.btn-primary:hover{filter:brightness(1.08)}
.btn-primary:active{filter:brightness(.95)}
.btn-ghost{background:var(--bg2);color:var(--txt);border:1px solid rgba(255,255,255,.1)}
.btn-ghost:hover{border-color:var(--accent)}
.foot{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:16px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:5px;vertical-align:middle}
#tests{
  display:none;margin-top:14px;padding:12px;border-radius:10px;
  background:var(--bg2);font-size:11px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--mute);white-space:pre-wrap;max-height:220px;overflow:auto;
}
.tests-show{display:block !important}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div class="head-icon">₪</div>
    <div>
      <h1>Конвертер валют</h1>
      <div class="sub">фиксированные курсы · офлайн</div>
    </div>
  </div>

  <div class="row">
    <div><label>Из</label><select id="from"></select></div>
    <div><button class="swap" id="swap" type="button" title="Поменять местами">⇄</button></div>
    <div><label>В</label><select id="to"></select></div>
  </div>

  <div style="margin-top:14px">
    <label>Сумма</label>
    <input id="amt" type="text" inputmode="decimal" value="100" autocomplete="off" spellcheck="false">
  </div>

  <div class="out">
    <div>
      <div class="res" id="res">—</div>
      <div class="res-small" id="ressmall">Введите сумму</div>
    </div>
    <div class="rate" id="rate"></div>
  </div>

  <div class="btn-row">
    <button class="btn-primary" id="conv-btn" type="button">Перевести</button>
    <button class="btn-ghost" id="copy" type="button">Копировать</button>
  </div>

  <div class="foot">
    <span><span class="dot"></span>курсы зафиксированы</span>
    <span id="status"></span>
  </div>

  <div id="tests"></div>
</div>
<script src="rates.js"></script>
<script src="app.js"></script>
</body>
</html>
